[project]
name = "duplicate-image-finder"
version = "0.1.0"
description = "Find exact and similar duplicate images using MD5 + perceptual hashing"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "faraday208" }]
keywords = ["image", "duplicate", "deduplication", "perceptual-hash", "dataset"]
dependencies = [
    "pillow>=10.0.0",
    "imagehash>=4.3.1",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
