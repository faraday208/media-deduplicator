[project]
name = "media-deduplicator"
version = "1.2.1"
description = "Media file deduplication (image — video desteği gelecek): exact (MD5) + similar (perceptual hash)"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "faraday208" }]
keywords = ["media", "image", "duplicate", "deduplication", "perceptual-hash", "dataset"]
dependencies = [
    "pillow>=10.0.0",
    "imagehash>=4.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
